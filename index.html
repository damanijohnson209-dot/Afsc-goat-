<style>
:root {

* { margin:0; padding:0; box-sizing:border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }
.noise {
  position: fixed; top:0; left:0; width:100%; height:100%;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");

}
.container { max-width: 1200px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }
header { text-align: center; padding: 40px 0 30px; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
header h1 {
  font-family: var(--mono); font-size: 28px; font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
header p { color: var(--text2); font-size: 14px; margin-top: 8px; font-weight: 300; }
.controls { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
.search-box { flex: 1; min-width: 250px; position: relative; }
.search-box input {
  width: 100%; padding: 12px 16px 12px 42px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 14px;
  font-family: var(--sans); outline: none; transition: border-color 0.2s;
}
.search-box input:focus { border-color: var(--accent); }
.search-box::before { content: '⌕'; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text2); font-size: 18px; }
.filter-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.filter-btn {
  padding: 8px 14px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text2); font-size: 12px; cursor: pointer;
  font-family: var(--mono); transition: all 0.15s; text-transform: uppercase; letter-spacing: 0.5px;
}
.filter-btn:hover { border-color: var(--accent); color: var(--text); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.stats { display: flex; gap: 20px; margin-bottom: 20px; font-family: var(--mono); font-size: 12px; color: var(--text2); flex-wrap: wrap; }
.stats span { color: var(--accent); font-weight: 700; }
table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
th {
  text-align: left; padding: 10px 12px; font-family: var(--mono); font-size: 11px;
  text-transform: uppercase; letter-spacing: 1px; color: var(--text2);
  border-bottom: 2px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 2;
}
td { padding: 8px 12px; border-bottom: 1px solid rgba(38,48,80,0.5); font-size: 14px; vertical-align: middle; }
tr:hover td { background: rgba(78,168,255,0.04); }
.afsc-code { font-family: var(--mono); font-weight: 700; color: #fff; font-size: 13px; white-space: nowrap; }
.career-group { font-size: 11px; color: var(--text2); font-family: var(--mono); }
.btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
.dl-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 10px; border-radius: 5px; text-decoration: none; font-size: 11px;
  font-family: var(--mono); transition: all 0.15s; white-space: nowrap; cursor: pointer;
  border: none; line-height: 1.4;
}
.dl-btn.direct { background: rgba(78,168,255,0.12); border: 1px solid rgba(78,168,255,0.3); color: var(--accent); }
.dl-btn.direct:hover { background: rgba(78,168,255,0.25); border-color: var(--accent); transform: translateY(-1px); }
.dl-btn.txt { background: rgba(45,212,168,0.12); border: 1px solid rgba(45,212,168,0.3); color: var(--accent2); }
.dl-btn.txt:hover { background: rgba(45,212,168,0.25); border-color: var(--accent2); transform: translateY(-1px); }
.dl-btn.txt.loading { opacity: 0.6; pointer-events: none; }
.dl-btn.txt.done { background: rgba(45,212,168,0.3); }
.dl-btn.txt.error { background: rgba(255,92,92,0.12); border-color: rgba(255,92,92,0.3); color: var(--danger); }
.dl-btn.search { background: rgba(255,140,66,0.1); border: 1px solid rgba(255,140,66,0.25); color: var(--accent3); }
.dl-btn.search:hover { background: rgba(255,140,66,0.2); border-color: var(--accent3); transform: translateY(-1px); }
.type-badge {
  display: inline-block; padding: 2px 6px; border-radius: 3px;
  font-size: 10px; font-family: var(--mono); font-weight: 700;

.type-badge.enlisted { background: rgba(45,212,168,0.15); color: var(--accent2); }
.type-badge.officer { background: rgba(78,168,255,0.15); color: var(--accent); }
.legend {
  display: flex; gap: 20px; margin-bottom: 20px; padding: 12px 16px;
  background: var(--surface); border-radius: 8px; border: 1px solid var(--border);
  font-size: 12px; flex-wrap: wrap;
}
.legend-item { display: flex; align-items: center; gap: 8px; }
.no-results { text-align: center; padding: 60px 20px; color: var(--text2); font-size: 16px; }
.toast {
  position: fixed; bottom: 20px; right: 20px; padding: 12px 20px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; font-size: 13px; color: var(--text);
  font-family: var(--mono); z-index: 100; opacity: 0;
  transition: opacity 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; }
.batch-bar {
  display: flex; gap: 12px; align-items: center; margin-bottom: 20px;
  padding: 12px 16px; background: var(--surface); border-radius: 8px;
  border: 1px solid var(--border);
}
.batch-btn {
  padding: 8px 16px; background: rgba(45,212,168,0.15); border: 1px solid rgba(45,212,168,0.3);
  border-radius: 6px; color: var(--accent2); font-size: 12px; cursor: pointer;

.batch-btn:hover { background: rgba(45,212,168,0.3); }
.batch-btn:disabled { opacity: 0.4; pointer-events: none; }
.batch-progress { font-family: var(--mono); font-size: 12px; color: var(--text2); }
@media (max-width: 600px) {
  .container { padding: 12px; }
  header h1 { font-size: 20px; }
  th:nth-child(3), td:nth-child(3) { display: none; }
  .controls { flex-direction: column; }
  .stats { gap: 10px; }

let filter = 'all', search = '';
function isDirect(u) { return u.startsWith('https://static.e-publishing'); }

function showToast(msg, duration=3000) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

async function extractText(pdfUrl) {
  const resp = await fetch(PROXY + encodeURIComponent(pdfUrl));
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const buf = await resp.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let fullText = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const lines = content.items.map(item => item.str).join(' ');
    fullText += `--- Page ${i} ---\n${lines}\n\n`;
  }
  return fullText;
}

function downloadTxt(filename, text) {
  const blob = new Blob([text], {type: 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function convertOne(afsc, pdfUrl, btnEl) {
  btnEl.classList.add('loading');
  btnEl.innerHTML = '<span class="dl-icon">⏳</span>Converting...';
  try {
    const text = await extractText(pdfUrl);
    const header = `CFETP ${afsc}\nSource: ${pdfUrl}\nExtracted: ${new Date().toISOString()}\n${'='.repeat(60)}\n\n`;
    downloadTxt(`CFETP_${afsc}.txt`, header + text);
    btnEl.classList.remove('loading'); btnEl.classList.add('done');
    btnEl.innerHTML = '<span class="dl-icon">✓</span>Done';
    return true;
  } catch(e) {
    btnEl.classList.remove('loading'); btnEl.classList.add('error');
    btnEl.innerHTML = '<span class="dl-icon">✗</span>Failed';
    btnEl.title = e.message;
    console.error(`Failed ${afsc}:`, e);
    return false;
  }
}

async function batchConvert() {
  const btn = document.getElementById('batchBtn');
  const prog = document.getElementById('batchProgress');
  const directItems = getFiltered().filter(d => isDirect(d.u));
  // Deduplicate by URL so we don't convert the same combined CFETP multiple times
  const seen = new Set();
  const unique = [];
  directItems.forEach(d => {
    if (!seen.has(d.u)) { seen.add(d.u); unique.push(d); }
  });

  btn.disabled = true;
  let done = 0, failed = 0;
  for (const d of unique) {
    prog.textContent = `Converting ${done+1}/${unique.length}... (${d.a})`;
    const el = document.getElementById(`txt-${d.a}`);
    if (el && !el.classList.contains('done')) {
      const ok = await convertOne(d.a, d.u, el);
      if (ok) done++; else failed++;
      // Small delay to not hammer the proxy
      await new Promise(r => setTimeout(r, 1500));
    } else {
      done++;
    }
  }
  prog.textContent = `Done! ${done} converted, ${failed} failed of ${unique.length} unique PDFs`;
  btn.disabled = false;
}

function getFiltered() {
  return data.filter(d => {
    if (filter === 'enlisted' && d.ty !== 'E') return false;
    if (filter === 'officer' && d.ty !== 'O') return false;
    if (filter === 'direct' && !isDirect(d.u)) return false;
    if (search) {
      const s = search.toLowerCase();
      return d.a.toLowerCase().includes(s) || d.t.toLowerCase().includes(s) || d.g.toLowerCase().includes(s);
    }
    return true;
  });
}

function render() {
  const filtered = getFiltered();
  const directCount = filtered.filter(d => isDirect(d.u)).length;
  const searchCount = filtered.length - directCount;
  const eCount = filtered.filter(d => d.ty === 'E').length;
  const oCount = filtered.filter(d => d.ty === 'O').length;

  document.getElementById('stats').innerHTML =
    `<div>Showing <span>${filtered.length}</span></div>` +
    `<div>Enlisted: <span>${eCount}</span></div>` +
    `<div>Officer: <span>${oCount}</span></div>` +
    `<div>Direct PDF: <span>${directCount}</span></div>` +
    `<div>Search: <span>${searchCount}</span></div>`;

  if (!filtered.length) {
    document.getElementById('table-container').innerHTML = '<div class="no-results">No AFSCs match.</div>';
    return;
  }

  let html = `<table><thead><tr><th>AFSC</th><th>Title</th><th>Group</th><th>Actions</th></tr></thead><tbody>`;
  filtered.forEach(d => {
    const direct = isDirect(d.u);
    const badge = d.ty === 'E' ? '<span class="type-badge enlisted">ENL</span>' : '<span class="type-badge officer">OFR</span>';
    let actions;
    if (direct) {
      actions = `<div class="btn-group">` +
        `<a href="${d.u}" target="_blank" class="dl-btn direct"><span class="dl-icon">↓</span>PDF</a>` +
        `<button id="txt-${d.a}" class="dl-btn txt" onclick="convertOne('${d.a}','${d.u}',this)"><span class="dl-icon">⬡</span>TXT</button>` +
        `</div>`;
    } else {
      actions = `<a href="${d.u}" target="_blank" class="dl-btn search"><span class="dl-icon">⌕</span>Search</a>`;
    }
    html += `<tr><td><span class="afsc-code">${d.a}</span> ${badge}</td><td>${d.t}</td><td class="career-group">${d.g}</td><td>${actions}</td></tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('table-container').innerHTML = html;
}

document.getElementById('search').addEventListener('input', e => { search = e.target.value; render(); });
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.filter;
    render();
  });
});
render();
</script>
</body>
</html>
